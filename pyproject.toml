[project]
name = "mazorca"
version = "0.1.0"
description = "Backend Mazorca"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2",
    "python-dotenv>=1",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
